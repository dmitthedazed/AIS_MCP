[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-mcp"
version = "0.1.1"
description = "MCP server for the STU Academic Information System"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ais-mcp = "ais_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
